version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "sql/migrations"
    queries:
      - "sql/queries"
    gen:
      go:
        package: "database"
        out: "internal/database/pgx"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_db_tags: true
        overrides:
          - db_type: "uuid"
            nullable: false
            go_type: 
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: false
          - db_type: "uuid"
            nullable: true
            go_type: 
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "timestamptz"
            nullable: false
            go_type: 
              import: "time"
              type: "Time"
              pointer: false
          - db_type: "timestamptz"
            nullable: true
            go_type: 
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "date"
            nullable: false
            go_type: 
              import: "time"
              type: "Time"
              pointer: false
          - db_type: "date"
            nullable: true
            go_type: 
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "text"
            nullable: false
            go_type: 
              type: "string"
              pointer: false
          - db_type: "text"
            nullable: true
            go_type: 
              type: "string"
              pointer: true
          - db_type: "pg_catalog.bool"
            nullable: false
            go_type: 
              type: "bool"
              pointer: false
          - db_type: "pg_catalog.bool"
            nullable: true
            go_type: 
              type: "bool"
              pointer: true
          - db_type: "pg_catalog.int2"
            nullable: false
            go_type: 
              type: "int16"
              pointer: false
          - db_type: "pg_catalog.int2"
            nullable: true
            go_type: 
              type: "int16"
              pointer: true
          - db_type: "pg_catalog.int4"
            nullable: false
            go_type: 
              type: "int32"
              pointer: false
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type: 
              type: "int32"
              pointer: true
          - db_type: "pg_catalog.int8"
            nullable: false
            go_type: 
              type: "int64"
              pointer: false
          - db_type: "pg_catalog.int8"
            nullable: true
            go_type: 
              type: "int64"
              pointer: true